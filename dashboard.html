<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #0f2e1c, #020617 70%);
    color: white;
}

/* Navbar */
.nav {
    background: rgba(0,0,0,0.5);
    padding: 15px;
    display: flex;
    justify-content: space-between;
}

/* Container */
.container {
    padding: 20px;
}

/* Cards */
.card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 12px;
    margin-top: 15px;
    box-shadow: 0 0 15px rgba(34,197,94,0.2);
}

/* Inputs */
input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
    border: none;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #22c55e, #4ade80);
    border: none;
    border-radius: 8px;
    color: black;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(34,197,94,0.5);
}

button:hover {
    box-shadow: 0 0 20px rgba(34,197,94,0.9);
}

.admin {
    color: gold;
}
</style>
</head>

<body>

<div class="nav">
    <div>VStock</div>
    <div id="userDisplay"></div>
</div>

<div class="container">

    <!-- Balance -->
    <div class="card">
        <h3>Balance</h3>
        <p id="balance"></p>
    </div>

    <!-- Send Money -->
    <div class="card">
        <h3>Send Money (VPay Sync)</h3>
        <input type="text" id="sendUser" placeholder="Enter Username">
        <input type="number" id="sendAmount" placeholder="Amount (£)">
        <button onclick="sendMoney()">Send</button>
    </div>

    <!-- Admin Panel -->
    <div class="card" id="adminPanel" style="display:none;">
        <h3>Admin Panel ⚡</h3>
        <p>Unlimited Control Enabled</p>
    </div>

</div>

<script>
const user = localStorage.getItem("user");
const role = localStorage.getItem("role");

if(!user) {
    window.location.href = "index.html";
}

// Load balance
let balance = parseInt(localStorage.getItem("balance"));

// Display user
let nameDisplay = user;

if(role === "admin") {
    nameDisplay += " 👑";
    document.getElementById("adminPanel").style.display = "block";
}

document.getElementById("userDisplay").innerText = nameDisplay;
document.getElementById("balance").innerText = "£ " + balance;

// SEND MONEY SYSTEM
function sendMoney() {
    const receiver = document.getElementById("sendUser").value.trim();
    const amount = parseInt(document.getElementById("sendAmount").value);

    if(receiver === "" || isNaN(amount) || amount <= 0) {
        alert("Enter valid details");
        return;
    }

    if(balance < amount) {
        alert("Not enough balance 💀");
        return;
    }

    // Deduct sender
    balance -= amount;
    localStorage.setItem("balance", balance);
    localStorage.setItem("user_" + user, balance);

    // Add receiver
    let receiverBalance = localStorage.getItem("user_" + receiver);
    if(!receiverBalance) receiverBalance = 0;

    receiverBalance = parseInt(receiverBalance) + amount;
    localStorage.setItem("user_" + receiver, receiverBalance);

    alert("Sent £" + amount + " to " + receiver + " 🚀");

    location.reload();
}
</script>

</body>
</html>
