<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #0f2e1c, #020617 70%);
    color: white;
}

.nav {
    padding: 15px;
    display: flex;
    justify-content: space-between;
    background: rgba(0,0,0,0.5);
}

.container {
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 12px;
    margin-top: 15px;
    box-shadow: 0 0 15px rgba(34,197,94,0.2);
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
    border: none;
}

button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #22c55e, #4ade80);
    border: none;
    border-radius: 8px;
    color: black;
    font-weight: bold;
    cursor: pointer;
}

.chat-box {
    height: 150px;
    overflow-y: auto;
    background: rgba(0,0,0,0.3);
    padding: 10px;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="nav">
    <div>VStock</div>
    <div id="userDisplay"></div>
</div>

<div class="container">

<div class="card">
    <h3>Balance</h3>
    <p id="balance"></p>
</div>

<div class="card">
    <h3>📊 Fake Stock Market</h3>
    <p>Stock Price: £ <span id="stockPrice"></span></p>
    <button onclick="buyStock()">Buy</button>
    <button onclick="sellStock()">Sell</button>
</div>

<div class="card">
    <h3>💸 Send Money (VPay Sync)</h3>
    <input type="text" id="sendUser" placeholder="Enter Username">
    <input type="number" id="sendAmount" placeholder="Amount (£)">
    <button onclick="sendMoney()">Send</button>
</div>

<div class="card">
    <h3>💬 Global Chat</h3>
    <div class="chat-box" id="chatBox"></div>
    <input type="text" id="chatInput" placeholder="Type message">
    <button onclick="sendMessage()">Send</button>
</div>

<div class="card">
    <h3>🏆 Leaderboard</h3>
    <div id="leaderboard"></div>
</div>

<div class="card" id="adminPanel" style="display:none;">
    <h3>👑 Admin Panel</h3>
    <p>You have full control</p>
</div>

</div>

<script>
const user = localStorage.getItem("user");
const role = localStorage.getItem("role");
let balance = parseInt(localStorage.getItem("balance"));

if(!user) window.location.href = "index.html";

document.getElementById("userDisplay").innerText =
role==="admin"? user+" 👑":user;

if(role==="admin"){
    document.getElementById("adminPanel").style.display="block";
}

function updateBalance(){ document.getElementById("balance").innerText="£ "+balance; }
updateBalance();

let price = Math.floor(Math.random()*100)+50;
document.getElementById("stockPrice").innerText = price;

setInterval(()=>{
    price += Math.floor(Math.random()*10-5);
    document.getElementById("stockPrice").innerText = price;
},2000);

function buyStock(){ if(balance>=price){ balance-=price; updateBalance(); } }
function sellStock(){ balance+=price; updateBalance(); }

function sendMoney(){
    let receiver = document.getElementById("sendUser").value.trim();
    let amount = parseInt(document.getElementById("sendAmount").value);

    if(amount>balance){ alert("Not enough balance 💀"); return; }

    balance-=amount;
    localStorage.setItem("balance",balance);
    localStorage.setItem("user_"+user,balance);

    let receiverBalance = localStorage.getItem("user_"+receiver)||0;
    receiverBalance=parseInt(receiverBalance)+amount;
    localStorage.setItem("user_"+receiver,receiverBalance);

    alert("Sent £"+amount+" to "+receiver+" 🚀");
    location.reload();
}

function sendMessage(){
    let msg=document.getElementById("chatInput").value;
    let chat=localStorage.getItem("chat")||"";
    chat+="<p><b>"+user+":</b> "+msg+"</p>";
    localStorage.setItem("chat",chat);
    loadChat();
}

function loadChat(){ document.getElementById("chatBox").innerHTML=localStorage.getItem("chat")||""; }
loadChat();

function loadLeaderboard(){
    let data="";
    for(let key in localStorage){
        if(key.startsWith("user_")){
            let name = key.replace("user_","");
            let bal = localStorage.getItem(key);
            data+="<p>"+name+" - £"+bal+"</p>";
        }
    }
    document.getElementById("leaderboard").innerHTML=data;
}
loadLeaderboard();
</script>

</body>
</html>
