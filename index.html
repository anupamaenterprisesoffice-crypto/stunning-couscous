<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VStock Login</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #0f2e1c, #020617 70%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Glow background */
body::before {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    background: #22c55e;
    filter: blur(120px);
    opacity: 0.2;
    top: 10%;
    left: 30%;
}

/* Login Box */
.login-box {
    position: relative;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    padding: 30px;
    border-radius: 15px;
    width: 320px;
    text-align: center;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: none;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #22c55e, #4ade80);
    border: none;
    border-radius: 8px;
    color: black;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(34,197,94,0.5);
}

button:hover {
    box-shadow: 0 0 25px rgba(34,197,94,0.9);
}
</style>
</head>

<body>

<div class="login-box">
    <h2>VStock Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<script>
function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if(username === "" || password === "") {
        alert("Enter details bro");
        return;
    }

    localStorage.setItem("user", username);

    // ADMIN
    if(username.toLowerCase() === "admin") {
        localStorage.setItem("role", "admin");
        localStorage.setItem("balance", "999999999999999");
    } else {
        localStorage.setItem("role", "user");

        // Sync existing balance (VPay system)
        let storedBalance = localStorage.getItem("user_" + username);

        if(storedBalance) {
            localStorage.setItem("balance", storedBalance);
        } else {
            localStorage.setItem("balance", "10000");
            localStorage.setItem("user_" + username, "10000");
        }
    }

    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
